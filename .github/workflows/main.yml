---
name: Make

on:
  schedule:
    - cron: '0 0 1 * *'
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  make:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          pacboy: |
            nsis:p
            efl:p
            pkg-config:p
            clang:p
            vala:p
            libsoup3:p
            libgit2-glib:p
            libarchive:p

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -xeuo pipefail
          bash -x .github/workflows/main.sh
          ./installer.exe /S /D=C:\efl-test-install

      - name: Build on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -x .github/workflows/main.sh
